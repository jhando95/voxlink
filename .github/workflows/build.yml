name: Build

# Cross-platform release-build matrix. Correctness (check/test/clippy/fmt) lives
# in ci.yml — this workflow only proves the release binaries link on every target
# and uploads them as artifacts. It deliberately does NOT run the test suite:
# the live_stress tests connect to the production server, so running them from CI
# would stress prod on every push.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-matrix:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x86_64
          - name: macOS aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-aarch64
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # glib/gtk/xdo/appindicator: needed by rfd (file dialogs) and the
          # tray-icon/muda stack on Linux — glib-sys fails the build without them.
          # gbm/drm: xcap (screen capture) links against libgbm, so app_desktop
          # fails at link time with `unable to find library -lgbm` without them.
          # Note CI only builds macOS and Windows, so Linux link errors surface
          # here and nowhere else.
          sudo apt-get install -y libasound2-dev libdbus-1-dev libfontconfig1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libx11-dev libpipewire-0.3-dev pkg-config libglib2.0-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libgbm-dev libdrm-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.artifact }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.artifact }}-cargo-

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/app_desktop*
            target/${{ matrix.target }}/release/signaling_server*
            !target/${{ matrix.target }}/release/*.d
            !target/${{ matrix.target }}/release/*.pdb
