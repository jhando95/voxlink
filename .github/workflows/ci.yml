name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # ui_shell's Slint-generated module is enormous; on the Windows runner rustc
  # aborts (exit code 3, no diagnostics) building its test harness at full
  # debuginfo. Give rustc a 32MB stack and use line-tables-only debuginfo for
  # test builds — backtraces in CI stay useful, memory/stack pressure drops.
  RUST_MIN_STACK: "33554432"
  CARGO_PROFILE_TEST_DEBUG: "1"

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets

      # server_tests spawn these binaries from target/debug at runtime;
      # `cargo test` alone does not produce them, so build explicitly first.
      - name: build binaries needed by integration tests
        run: cargo build -p signaling_server -p app_desktop

      - name: cargo test (skip flaky)
        shell: bash
        run: |
          cargo test --workspace --no-fail-fast -- \
            --skip live_stress \
            --skip test_create_space \
            --skip test_audio_after_leave_room \
            --skip test_channel_audio_relay \
            --skip test_authenticate_invalid_token_creates_new

  lint:
    name: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint-macos

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # Strict gate: the workspace reached zero clippy warnings in v0.13.3.
      # New warnings fail CI so hygiene can't silently drift again.
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  windows-installer:
    name: windows-installer
    runs-on: windows-latest
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-installer

      - name: cargo build --release
        run: cargo build --release --workspace

      - name: Build portable zip
        shell: powershell
        run: installer\build-portable.ps1

      # voxlink.iss bundles the VC++ runtime from installer/redist/, which is
      # gitignored — fetch it fresh (same as release.yml does).
      - name: Download VC++ Redistributable
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path installer\redist | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "installer\redist\vc_redist.x64.exe" -UseBasicParsing

      - name: Compile Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: installer/voxlink.iss
          options: /O+

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxlink-windows-installer-${{ github.ref_name }}
          path: |
            target/installer/Voxlink-Setup-*.exe
            target/Voxlink-*.zip
          if-no-files-found: error
